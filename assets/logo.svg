<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5297FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7B68EE;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a7ba7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5297FF;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="200" fill="#191b1d" rx="12"/>

  <!-- Timeline tracks -->
  <g transform="translate(30, 40)">
    <!-- Track 1 -->
    <rect x="0" y="0" width="200" height="35" fill="#2f3134" rx="4"/>
    <rect x="10" y="5" width="80" height="25" fill="url(#grad1)" rx="4"/>
    <rect x="100" y="5" width="50" height="25" fill="url(#grad2)" rx="4"/>

    <!-- Track 2 -->
    <rect x="0" y="45" width="200" height="35" fill="#2f3134" rx="4"/>
    <rect x="30" y="50" width="120" height="25" fill="url(#grad1)" rx="4"/>

    <!-- Track 3 -->
    <rect x="0" y="90" width="200" height="35" fill="#2f3134" rx="4"/>
    <rect x="60" y="95" width="70" height="25" fill="url(#grad2)" rx="4"/>
    <rect x="140" y="95" width="40" height="25" fill="url(#grad1)" rx="4"/>

    <!-- Playhead -->
    <line x1="85" y1="-10" x2="85" y2="135" stroke="#5297FF" stroke-width="2"/>
    <polygon points="85,-10 78,-20 92,-20" fill="#5297FF"/>
  </g>

  <!-- Text -->
  <text x="270" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="#ffffff">
    trakk
  </text>
</svg>
